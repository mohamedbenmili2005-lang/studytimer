<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4F46E5"/>
      <stop offset="1" stop-color="#7C3AED"/>
    </linearGradient>
    <linearGradient id="arc" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#34D399"/>
      <stop offset="1" stop-color="#22D3EE"/>
    </linearGradient>
  </defs>
  <!-- Fond arrondi -->
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  <!-- Bouton du chronometre -->
  <rect x="226" y="62" width="60" height="30" rx="10" fill="#FFFFFF"/>
  <rect x="246" y="86" width="20" height="30" fill="#FFFFFF"/>
  <!-- Cadran -->
  <circle cx="256" cy="288" r="158" fill="#FFFFFF" fill-opacity="0.14"/>
  <circle cx="256" cy="288" r="132" fill="none" stroke="#FFFFFF" stroke-opacity="0.35" stroke-width="20"/>
  <!-- Arc de progression (environ 70 %) -->
  <circle cx="256" cy="288" r="132" fill="none" stroke="url(#arc)" stroke-width="20"
          stroke-linecap="round" stroke-dasharray="580 830" transform="rotate(-90 256 288)"/>
  <!-- Livre ouvert -->
  <path d="M256 262 C232 244 200 242 176 250 V332 C200 324 232 326 256 344 Z" fill="#FFFFFF"/>
  <path d="M256 262 C280 244 312 242 336 250 V332 C312 324 280 326 256 344 Z" fill="#FFFFFF" fill-opacity="0.82"/>
  <!-- Aiguille -->
  <line x1="256" y1="288" x2="256" y2="214" stroke="#FFFFFF" stroke-width="0" />
</svg>
