# Study Timer : PostgreSQL + API + Nginx (TLS) + sauvegardes
# Usage : copier .env.example en .env, remplir, puis : docker compose up -d --build
services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: studytimer
      POSTGRES_USER: studyuser
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD manquant dans .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U studyuser -d studytimer"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks: [backend]

  api:
    build: ./backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      ConnectionStrings__Default: "Host=db;Port=5432;Database=studytimer;Username=studyuser;Password=${DB_PASSWORD}"
      Jwt__Key: ${JWT_KEY:?JWT_KEY manquante dans .env (32 caracteres minimum)}
      Cors__Origins__0: ${PUBLIC_URL:?PUBLIC_URL manquant dans .env}
      Swagger__Enabled: ${SWAGGER_ENABLED:-false}
    networks: [backend, frontend]

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    depends_on: [api]
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./deploy/certs:/etc/nginx/certs:ro
      - ./mobile/study_timer/build/web:/usr/share/nginx/html:ro
    networks: [frontend]

  backup:
    image: postgres:17-alpine
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      PGHOST: db
      PGUSER: studyuser
      PGPASSWORD: ${DB_PASSWORD}
      PGDATABASE: studytimer
      KEEP_DAYS: ${BACKUP_KEEP_DAYS:-14}
    volumes:
      - ./backups:/backups
      - ./deploy/scripts/backup.sh:/backup.sh:ro
    entrypoint: ["/bin/sh", "-c", "while true; do sh /backup.sh; sleep 86400; done"]
    networks: [backend]

volumes:
  pgdata:

networks:
  backend:
  frontend:
