services:
  db:
    image: postgres:16
    container_name: studytimer-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: studyuser
      POSTGRES_PASSWORD: ChangeMe123!
      POSTGRES_DB: studytimer
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
volumes:
  pgdata:
